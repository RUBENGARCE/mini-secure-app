name: CI Basic
on:
  push:
    branches: [ desarrollo ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node v20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: npm install
        run: npm install
      - name: jest
        run: npm test
      - name: npm audit
        run: npm audit || true
      - name: Iniciar aplicacion
        run: |
          npm start &
          sleep 90
          curl -I http://localhost:3001 || true
      - name: Ejecutar ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3001'
          cmd_options: '-r report_html.html'
      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-Report
          path: report_html.html
      - name: SAST con Semgrep
        run: |
          pip install semgrep
          semgrep --config=auto
