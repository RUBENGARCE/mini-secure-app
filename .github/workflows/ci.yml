name: CI Basic

on:
  push:
    branches: [ desarrollo ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node v20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: npm install
        run: npm install

      - name: jest
        run: npm test

      - name: npm audit
        run: npm audit || true
- name: SAST con Semgrep
        run: |
          pip install semgrep
          semgrep --config=auto
